# Самый простой вариант для Linux-сервера — host-сеть: голос видит настоящие IP машины.
# На Docker Desktop (Windows/macOS) host-сеть не работает — закомментируйте network_mode,
# раскомментируйте ports и укажите RTC_PUBLIC_IP (внешний IP и/или LAN-IP ПК через запятую).
services:
  z228:
    build: .
    image: z228:latest
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "3000:3000"
    #   - "3443:3443"
    #   - "50000:50000/udp"
    #   - "50000:50000/tcp"
    volumes:
      - ./data:/data
    environment:
      SERVER_NAME: ${SERVER_NAME:-z228}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RTC_PUBLIC_IP: ${RTC_PUBLIC_IP:-}
      # Свой домен + бесплатный сертификат (нужны открытые 80 и 443):
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      # PORT: "80"
      # HTTPS_PORT: "443"
